worker_processes auto;
events { worker_connections 65535; }

http {
  # Docker's embedded DNS returns every replica of "gateway"; re-resolve often so
  # replicas that die or start are picked up. No ip_hash / sticky: plain distribution (RT-2).
  resolver 127.0.0.11 valid=5s ipv6=off;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;

    location / {
      set $upstream http://gateway:4000;
      proxy_pass $upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_buffering off;          # SSE must not be buffered
      proxy_cache off;
      proxy_read_timeout 3600s;     # long-lived streams
      proxy_send_timeout 3600s;
      proxy_next_upstream error timeout http_503;
    }
  }
}
